[build]
  command = "cd ../.. && pnpm install && cd apps/mobile && pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  EXPO_PUBLIC_API_URL = "https://tapinapi-production.up.railway.app/api/v1"
  EXPO_PUBLIC_ENV = "production"

# Serve font files directly (must be before the SPA redirect)
[[redirects]]
  from = "/fonts/*"
  to = "/fonts/:splat"
  status = 200

# Serve static assets directly
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/_expo/*"
  to = "/_expo/:splat"
  status = 200

# SPA redirect - solo aplica si el archivo no existe (force = false es default)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache para assets estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font files with proper MIME type
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/ttf"
    Access-Control-Allow-Origin = "*"
