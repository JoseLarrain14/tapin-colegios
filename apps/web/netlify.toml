[build]
  command = "pnpm build"
  publish = ".next"

# Next.js plugin for full support (SSR, ISR, middleware, etc.)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables (set these in Netlify UI for production values)
[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_URL = "https://your-api-url.com/api/v1"

# Headers for PWA
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirects for SPA fallback (Next.js handles most, but just in case)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}
